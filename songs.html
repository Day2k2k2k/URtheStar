<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Setlist - U R The Star</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #fc8600;
      --cyan: #0bb0c3;
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.45);
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 32px 24px;
      background: #000;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      flex-shrink: 0;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--cyan); }

    /* ─── SONG LIST VIEW ─── */
    #songView {
      display: flex;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px;
      gap: 28px;
      flex: 1;
      min-height: 0;          /* lets the inner list scroll instead of the page */
    }

    .sidebar {
      width: 180px;
      flex-shrink: 0;
    }

    .sidebar h3 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    #genreList { list-style: none; }

    #genreList li {
      padding: 9px 14px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      color: var(--muted);
      transition: all 0.15s;
      margin-bottom: 2px;
    }

    #genreList li:hover { background: var(--surface2); color: #fff; }
    #genreList li.active { background: var(--surface2); color: var(--cyan); font-weight: 600; }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.35;
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    #search:focus { border-color: var(--cyan); }
    #search::placeholder { color: var(--muted); }

    .song-count {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    /* the scrolling list itself */
    #songList {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 6px;
    }

    #songList::-webkit-scrollbar { width: 8px; }
    #songList::-webkit-scrollbar-track { background: transparent; }
    #songList::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.14);
      border-radius: 4px;
    }
    #songList::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
    #songList { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }

    #songList li {
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      padding: 13px 18px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      /* browse only - no pointer, no click affordance */
      cursor: default;
    }

    .song-name { font-size: 14px; font-weight: 500; }
    .song-title { color: #ffffff; }
    .song-artist { color: var(--cyan); font-weight: 400; }

    .song-genre {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(252,134,0,0.15);
      color: var(--pink);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      flex-shrink: 0;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 15px;
      display: none;
    }

    .setlist-note {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    @media (max-width: 650px) {
      header { padding: 18px 18px 14px; }
      #songView { flex-direction: column; padding: 18px 16px; gap: 16px; }
      .sidebar { width: 100%; }
      #genreList { display: flex; flex-wrap: wrap; gap: 8px; }
      #genreList li { padding: 7px 14px; margin-bottom: 0; }
      #songList { padding-right: 2px; }
    }
  </style>
</head>
<body>

<header>
  <img src="URTS_logo_2000px.avif" alt="Ur The Star" style="height:96px; width:auto; display:block;">
  <a href="index.html" class="back-link">← Back to Home</a>
</header>

<!-- ═══ SONG LIST (browse only) ═══ -->
<div id="songView">
  <div class="sidebar">
    <h3>Genre</h3>
    <ul id="genreList">
      <li data-genre="all" class="active">All</li>
      <li data-genre="rock">Rock</li>
      <li data-genre="indie">Indie</li>
      <li data-genre="pop">Pop</li>
      <li data-genre="classic">Classics</li>
      <li data-genre="party">Party</li>
    </ul>
  </div>

  <div class="main">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search" placeholder="Search songs or artists...">
    </div>
    <p class="setlist-note">Browse what we play. Pick your song on the night — just come and find us.</p>
    <p class="song-count" id="songCount"></p>
    <p class="no-results" id="noResults">No songs found. Try a different search.</p>
    <p id="loadingMsg" style="color:var(--muted); font-size:14px; padding:20px 0;">Loading setlist…</p>
    <ul id="songList"></ul>
  </div>
</div>

<script>
  const SHEET_ID   = '1WflWLizxpj3QJveA2y4vC8MwafQ1LBI2grhNVz8h3Dg';
  const API_KEY    = 'AIzaSyAWit6wEJCofhTDZlqMIyXhpJ5vEkLNiCA';
  const SHEET_URL  = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1?key=${API_KEY}`;

  const searchEl   = document.getElementById('search');
  const songList   = document.getElementById('songList');
  const songCount  = document.getElementById('songCount');
  const noResults  = document.getElementById('noResults');
  const loadingMsg = document.getElementById('loadingMsg');
  const genres     = document.querySelectorAll('#genreList li');

  let currentGenre = 'all';
  let allSongEls   = [];

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Load songs from Google Sheets ──
  async function loadSongs() {
    try {
      const res  = await fetch(SHEET_URL);
      const data = await res.json();
      const rows = (data.values || []).slice(1);
      songList.innerHTML = '';
      allSongEls = [];

      rows.forEach(row => {
        const title  = (row[0] || '').trim();
        const artist = (row[1] || '').trim();
        const genre  = (row[2] || 'rock').toLowerCase().trim();
        if (!title) return;

        const li = document.createElement('li');
        li.dataset.genre = genre;
        li.innerHTML = `
          <span class="song-name">
            <span class="song-title">${esc(title)}</span>
            ${artist ? `<span class="song-artist"> – ${esc(artist)}</span>` : ''}
          </span>
          <span class="song-genre">${esc(genre)}</span>
        `;
        songList.appendChild(li);
        allSongEls.push(li);
      });

      loadingMsg.style.display = 'none';
      filterSongs();
    } catch(e) {
      loadingMsg.textContent = 'Could not load songs — please check your connection.';
    }
  }

  function countVisible() {
    const visible = allSongEls.filter(s => s.style.display !== 'none').length;
    songCount.textContent = `${visible} song${visible !== 1 ? 's' : ''}`;
    noResults.style.display = visible === 0 ? 'block' : 'none';
  }

  function filterSongs() {
    const term = searchEl.value.toLowerCase();
    allSongEls.forEach(song => {
      const matchesSearch = song.textContent.toLowerCase().includes(term);
      const matchesGenre  = currentGenre === 'all' || song.dataset.genre === currentGenre;
      song.style.display  = (matchesSearch && matchesGenre) ? 'flex' : 'none';
    });
    countVisible();
    songList.scrollTop = 0;
  }

  searchEl.addEventListener('input', filterSongs);

  genres.forEach(genre => {
    genre.addEventListener('click', () => {
      genres.forEach(g => g.classList.remove('active'));
      genre.classList.add('active');
      currentGenre = genre.dataset.genre;
      filterSongs();
    });
  });

  loadSongs();
</script>
</body>
</html>
